<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mango Drop QR | Tutti Mango</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .qr { padding-block: 38px; text-align: center; }
    .qr .logo { margin-inline: auto; }
    .qr .code { display: block; width: min(100%, 278px); height: auto; margin: 18px auto; }
  </style>
</head>
<body>
  <main class="page qr">
    <img class="logo game-logo" src="../tutti-mango.webp" width="527" height="247" alt="Tutti Mango Fruit Cuisine">
    <h1>Scan to play</h1>
    <img class="code" src="mango-drop-qr.svg" width="278" height="278" alt="QR code linking to the Mango Drop homepage">
    <p>Private demo. Sign in with the owner’s ChatGPT account to play on your phone.</p>
    <a class="action" href="mango-drop-qr.svg" download>Download demo QR</a>
  </main>
</body>
</html>
